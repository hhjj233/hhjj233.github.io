<div class="masthead">
  <div class="masthead__inner-wrap academic-masthead">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="academic-nav" aria-label="Main navigation">
      {% for link in site.data.navigation.main %}
      <a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
      {% endfor %}
      <button type="button" class="theme-button" data-theme-toggle aria-label="Switch to dark theme" aria-pressed="false"><i class="fa-solid fa-moon" aria-hidden="true"></i></button>
    </nav>
  </div>
</div>
